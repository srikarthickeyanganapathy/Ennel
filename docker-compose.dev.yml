# Local development infrastructure only: Postgres and Redis. No application images (deployment is out of scope).
name: ennel-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ennel
      POSTGRES_PASSWORD: ennel
      POSTGRES_DB: ennel
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ennel -d ennel']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
